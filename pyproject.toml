[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minebridge"
version = "20.10a"
description = "MineBridge Telegram assistant"
requires-python = ">=3.10"
dependencies = [
  "aiogram>=3.0.0",
  "httpx>=0.26",
  "numpy>=1.25",
  "python-dotenv>=1.0",
  "openai>=1.40",
  "google-generativeai>=0.7",
]

[project.optional-dependencies]
dev = [
  "black>=24.3",
  "ruff>=0.4",
  "isort>=5.13",
  "pytest>=8.0",
]

[project.scripts]
minebridge = "minebridge.__main__:_run"

[tool.isort]
profile = "black"

