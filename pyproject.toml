[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minebridge"
version = "25.01"
description = "MineBridge Telegram assistant для Minecraft сервера"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "JustCheburek"}
]
dependencies = [
  "aiogram==3.22.0",
  "httpx==0.28.1",
  "numpy==1.26.4",
  "openai==1.108.2",
  "python-dotenv==1.1.1",
  "nextcord==2.6.0",
  "google-generativeai==0.8.5",
  "rlottie-python==1.3.8",
  "Pillow==11.2.1",
  "edge-tts==7.2.3",
  "aiohttp==3.11.11",
]

[project.optional-dependencies]
dev = [
  "black>=24.3",
  "ruff>=0.8",
  "isort>=5.13",
  "mypy>=1.8",
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "pytest-asyncio>=0.21",
]

[tool.setuptools]
packages = [
  "core",
  "domain",
  "application",
  "application.middleware",
  "application.services",
  "application.resources",
  "infrastructure",
  "infrastructure.external",
  "infrastructure.repositories",
  "presentation",
  "presentation.handlers",
  "presentation.handlers.commands",
  "utils",
]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | archive
)/
'''

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "archive",
]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
